<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REBAZ TV</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: transparent;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 60px;
            background: linear-gradient(180deg, #0e1628 0%, #060913 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            border-bottom: 1px solid #1e293b;
        }

        .top-nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-item {
            color: #f59e0b;
            font-size: 16px;
            font-weight: bold;
            padding: 6px 16px;
            border-bottom: 2px solid #f59e0b;
        }

        .search-box {
            background: #111827;
            border: 1px solid #374151;
            border-radius: 20px;
            padding: 5px 20px;
            width: 300px;
            display: flex;
            align-items: center;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            width: 100%;
            text-align: center;
        }

        .app-logo {
            font-weight: bold;
            color: #38bdf8;
            font-size: 18px;
            background: #0f172a;
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px solid #0284c7;
        }

        .main-content {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
        }

        .categories-pane {
            width: 22%;
            background: #0b1120;
            border-left: 1px solid #1e293b;
            overflow-y: auto;
            padding: 10px 0;
        }

        .cat-item {
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #f59e0b;
            background: #1e293b;
            border-right: 4px solid #f59e0b;
            font-size: 15px;
            cursor: pointer;
        }

        .channels-pane {
            width: 26%;
            background: #0f172a;
            border-left: 1px solid #1e293b;
            overflow-y: auto;
            padding: 10px 0;
        }

        .ch-item {
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #e2e8f0;
            font-size: 14px;
            cursor: pointer;
        }

        .ch-item.active {
            background: #1e293b;
            color: #38bdf8;
        }

        .ch-num {
            color: #64748b;
            font-size: 13px;
            width: 30px;
        }

        .player-pane {
            width: 52%;
            display: flex;
            flex-direction: column;
            background: transparent;
            position: relative;
        }

        .video-container {
            width: 100%;
            height: 70%;
            background: transparent;
            position: relative;
            cursor: pointer;
        }

        .channel-title-overlay {
            position: absolute;
            bottom: 10px;
            right: 15px;
            background: rgba(0, 0, 0, 0.75);
            padding: 6px 15px;
            border-radius: 6px;
            font-size: 15px;
            color: #ffffff;
            font-weight: bold;
        }

        .live-badge {
            position: absolute;
            top: 10px;
            left: 15px;
            background: #ef4444;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .controls-pane {
            height: 30%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(180deg, #0b1120 0%, #030712 100%);
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }

        body.fullscreen-mode .header,
        body.fullscreen-mode .categories-pane,
        body.fullscreen-mode .channels-pane,
        body.fullscreen-mode .controls-pane {
            display: none !important;
        }

        body.fullscreen-mode .main-content {
            height: 100vh !important;
            width: 100vw !important;
        }

        body.fullscreen-mode .player-pane {
            width: 100vw !important;
            height: 100vh !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 99999 !important;
        }

        body.fullscreen-mode .video-container {
            width: 100vw !important;
            height: 100vh !important;
            background: transparent !important;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="top-nav">
            <div class="nav-item">بث مباشر</div>
        </div>
        <div class="search-box">
            <input type="text" placeholder="بحث عن قناة..." readonly>
        </div>
        <div class="app-logo">REBAZ TV</div>
    </div>

    <div class="main-content">
        <div class="categories-pane">
            <div class="cat-item">
                <span>Alwan Sports</span>
                <span style="color:#64748b;">1</span>
            </div>
        </div>

        <div class="channels-pane" id="chPane"></div>

        <div class="player-pane" id="playerPane">
            <div class="video-container" id="videoContainer" onclick="toggleFullScreen()">
                <div class="live-badge">LIVE</div>
                <div class="channel-title-overlay" id="currentChTitle">4K | Alwan Sport 1</div>
            </div>

            <div class="controls-pane">
                <div></div>
                <div class="action-buttons">
                    <button class="btn" onclick="reloadStream()">تحديث البث</button>
                    <button class="btn" onclick="toggleFullScreen()">ملء الشاشة</button>
                    <button class="btn">بحث</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const categories = [
            {
                name: "Alwan Sports",
                channels: [
                    { 
                        num: "149", 
                        name: "4K | Alwan Sport 1", 
                        url: "http://eaglevnew.top/live/890608893636/957330157995/757045.ts" 
                    }
                ]
            }
        ];

        let currentUrl = "";
        let currentName = "";
        let isFullScreen = false;

        function toggleFullScreen() {
            isFullScreen = !isFullScreen;
            if (isFullScreen) {
                document.body.classList.add('fullscreen-mode');
            } else {
                document.body.classList.remove('fullscreen-mode');
            }

            if (window.Android && window.Android.toggleFullScreen) {
                window.Android.toggleFullScreen(isFullScreen);
            }
        }

        function exitFullScreenJS() {
            isFullScreen = false;
            document.body.classList.remove('fullscreen-mode');
        }

        function loadChannels(catIndex) {
            const chPane = document.getElementById('chPane');
            chPane.innerHTML = '';

            const channels = categories[catIndex].channels;
            channels.forEach((ch, idx) => {
                const div = document.createElement('div');
                div.className = `ch-item ${idx === 0 ? 'active' : ''}`;
                div.innerHTML = `<span class="ch-num">${ch.num}</span> <span>${ch.name}</span>`;
                div.onclick = () => playStream(ch.url, ch.name, div);
                chPane.appendChild(div);
            });
        }

        function reloadStream() {
            if (currentUrl) {
                playStream(currentUrl, currentName);
            }
        }

        function playStream(url, name, element = null) {
            currentUrl = url;
            currentName = name;

            if(element) {
                document.querySelectorAll('.ch-item').forEach(el => el.classList.remove('active'));
                element.classList.add('active');
            }
            document.getElementById('currentChTitle').innerText = name;

            if (window.Android && window.Android.playStream) {
                window.Android.playStream(url);
            }
        }

        window.onload = () => {
            loadChannels(0);
            setTimeout(() => {
                if (categories[0].channels.length > 0) {
                    playStream(categories[0].channels[0].url, categories[0].channels[0].name);
                }
            }, 600);
        };
    </script>
</body>
</html>
