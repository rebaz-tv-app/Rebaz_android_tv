<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REBAZ TV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: transparent;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            direction: rtl;
        }
        /* سەرۆکی سەرەوە کە هاوتایە لەگەڵ بەرزی 60 پێکسڵ لە ئەپەکەدا */
        .header {
            height: 60px;
            background: #0b0f19;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid #1a2238;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #00ffcc;
        }
        .time {
            font-size: 16px;
            color: #8892b0;
        }

        /* چوارچێوەی سەرەکی */
        .main-container {
            display: flex;
            height: calc(100vh - 60px);
        }

        /* شوێنی بەتاڵی ڤیدیۆ لە چەپ (52٪) بۆ ئەوەی پلەیەرە ڕەسەنەکە تێیدا دەركەوێت */
        .player-placeholder {
            width: 52%;
            height: 100%;
            pointer-events: none; /* وا دەکات کلیکەکان ڕاستەوخۆ بچنە سەر پلەیەرەکە */
            position: relative;
        }

        /* دوگمەی گەورەکردنی شاشە */
        .controls-overlay {
            position: absolute;
            bottom: 15px;
            left: 15px;
            pointer-events: auto;
        }
        .btn {
            background: #00ffcc;
            color: #060913;
            border: none;
            padding: 10px 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:focus, .btn:hover {
            outline: 3px solid #ffffff;
            background: #ffffff;
        }

        /* لیستەی کەناڵەکان لە لای ڕاست (48٪) */
        .sidebar {
            width: 48%;
            height: 100%;
            background: #060913;
            padding: 20px;
            overflow-y: auto;
        }
        .section-title {
            font-size: 16px;
            margin-bottom: 15px;
            color: #8892b0;
            font-weight: bold;
        }
        .channel-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .channel-item {
            background: #111827;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .channel-item:focus, .channel-item:hover {
            border-color: #00ffcc;
            background: #1f293d;
            outline: none;
        }
        .channel-name {
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">REBAZ TV 📺</div>
        <div class="time" id="clock">--:--</div>
    </div>

    <div class="main-container">
        <!-- شوێنی پلەیەر (بەتاڵە بۆ ئەوەی ئەوەی خوارەوەی دیار بێت) -->
        <div class="player-placeholder">
            <div class="controls-overlay">
                <button class="btn" onclick="toggleFull()">شاشەی پڕ (Fullscreen)</button>
            </div>
        </div>

        <!-- لیستەی کەناڵەکان -->
        <div class="sidebar">
            <div class="section-title">کەناڵە ئاسمانییەکان</div>
            <div class="channel-list">
                <!-- لینکەکان بگۆڕە بە لینکەی ڕاستەقینەی خۆت M3U8 / HLS -->
                <div class="channel-item" tabindex="0" onclick="playChannel('https://path/to/stream1.m3u8')">
                    <span class="channel-name">کەناڵی یەکەم (نموونە)</span>
                    <span>▶</span>
                </div>
                <div class="channel-item" tabindex="0" onclick="playChannel('https://path/to/stream2.m3u8')">
                    <span class="channel-name">کەناڵی دووەم (نموونە)</span>
                    <span>▶</span>
                </div>
                <div class="channel-item" tabindex="0" onclick="playChannel('https://path/to/stream3.m3u8')">
                    <span class="channel-name">کەناڵی سێیەم (نموونە)</span>
                    <span>▶</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isFull = false;

        function playChannel(url) {
            if (window.Android && typeof window.Android.playStream === 'function') {
                window.Android.playStream(url);
            } else {
                alert('لینکەکە کارا ناکات لە دەرەوەی ئەپ: ' + url);
            }
        }

        function toggleFull() {
            isFull = !isFull;
            if (window.Android && typeof window.Android.toggleFullScreen === 'function') {
                window.Android.toggleFullScreen(isFull);
            }
            const btn = document.querySelector('.btn');
            btn.innerText = isFull ? 'شاشەی ئاسایی' : 'شاشەی پڕ (Fullscreen)';
        }

        // ئەم فەنکشنە بانگ دەکرێت کاتێک لە اندرۆید دوگمەی Back دەکرێت لە شاشەی پڕدا
        function exitFullScreenJS() {
            isFull = false;
            const btn = document.querySelector('.btn');
            btn.innerText = 'شاشەی پڕ (Fullscreen)';
        }

        // کاتژمێر
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }, 1000);
    </script>
</body>
</html>
