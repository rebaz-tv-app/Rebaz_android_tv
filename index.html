<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REBAZ TV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #050811;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            direction: rtl;
        }

        /* Top Navigation Bar */
        .header {
            height: 48px;
            background: #080c18;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border-bottom: 1px solid #141e33;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .nav-item {
            font-size: 14px;
            color: #8fa0c0;
            cursor: pointer;
            padding: 5px 8px;
            border-bottom: 2px solid transparent;
        }
        .nav-item.active {
            color: #e5a93b;
            font-weight: bold;
            border-bottom-color: #e5a93b;
        }
        .search-box {
            background: #0d1527;
            border: 1px solid #1e2c4a;
            border-radius: 20px;
            padding: 4px 12px;
            display: flex;
            align-items: center;
            width: 220px;
        }
        .search-box input {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            width: 100%;
            font-size: 12px;
            text-align: right;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: bold;
            color: #00d2ff;
        }

        /* Main Container Layout */
        .main-layout {
            display: flex;
            height: calc(100vh - 48px);
            width: 100vw;
        }

        /* Left Side: Categories & Channels */
        .left-side {
            width: 50%;
            display: flex;
            border-left: 1px solid #141e33;
            background: #070b16;
        }

        .categories-col {
            width: 45%;
            background: #090e1c;
            border-left: 1px solid #141e33;
            overflow-y: auto;
        }
        .cat-item {
            padding: 12px 10px;
            font-size: 13px;
            color: #a0b2d6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid #0d1527;
        }
        .cat-item.active, .cat-item:hover, .cat-item:focus {
            background: #121c33;
            color: #e5a93b;
            outline: none;
        }
        .cat-count {
            font-size: 11px;
            color: #5d7299;
        }

        .channels-col {
            width: 55%;
            background: #070b16;
            overflow-y: auto;
        }
        .ch-item {
            padding: 10px;
            font-size: 13px;
            color: #d8e4fc;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            border-bottom: 1px solid #0d1527;
        }
        .ch-item.active, .ch-item:hover, .ch-item:focus {
            background: #14213d;
            color: #ffffff;
            outline: none;
            border-right: 3px solid #00d2ff;
        }
        .ch-num {
            font-size: 12px;
            color: #5d7299;
            width: 28px;
        }

        /* Right Side Layout */
        .right-side {
            width: 50%;
            display: flex;
            flex-direction: column;
        }

        .player-space {
            height: 62%;
            background: transparent;
            pointer-events: none;
        }

        .info-panel {
            height: 38%;
            background: #050811;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-top: 1px solid #141e33;
        }
        .ch-title {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
        }
        .action-btns {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .btn {
            background: #0072ce;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:focus, .btn:hover {
            background: #0099ff;
            outline: 2px solid #ffffff;
        }
        .btn-fav {
            background: #1a2744;
            color: #a0b2d6;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <div class="header">
        <div class="nav-links">
            <div class="nav-item">مسكن</div>
            <div class="nav-item active">بث مباشر</div>
            <div class="nav-item">افلام</div>
            <div class="nav-item">مسلسلات</div>
        </div>
        <div class="search-box">
            <input type="text" placeholder="بحث...">
        </div>
        <div class="logo">
            <span>📺</span> REBAZ TV
        </div>
    </div>

    <!-- Main Content Layout -->
    <div class="main-layout">
        <!-- Left Side: Categories & Channels -->
        <div class="left-side">
            <!-- Categories -->
            <div class="categories-col">
                <div class="cat-item active" tabindex="0">
                    <span>وەرزشی</span>
                    <span class="cat-count">1</span>
                </div>
            </div>

            <!-- Channels List -->
            <div class="channels-col">
                <div class="ch-item active" tabindex="0" onclick="playChannel('http://mhiptv.com:8080/live/hk030/6985423976/212760.ts', 'Alwan Sport 1 4K')">
                    <span class="ch-num">1</span>
                    <span>Alwan Sport 1 4K</span>
                </div>
            </div>
        </div>

        <!-- Right Side -->
        <div class="right-side">
            <div class="player-space"></div>
            <div class="info-panel">
                <div class="ch-title" id="selected-ch">Alwan Sport 1 4K</div>
                <div class="action-btns">
                    <button class="btn btn-fav">إضافة إلى المفضلة</button>
                    <button class="btn" onclick="toggleFull()">شاشەی پڕ (Fullscreen)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isFull = false;

        window.onload = function() {
            setTimeout(() => {
                playChannel('http://mhiptv.com:8080/live/hk030/6985423976/212760.ts', 'Alwan Sport 1 4K');
            }, 1000);
        };

        function playChannel(url, title) {
            document.getElementById('selected-ch').innerText = title;
            if (window.Android && typeof window.Android.playStream === 'function') {
                window.Android.playStream(url);
            }
        }

        function toggleFull() {
            isFull = !isFull;
            if (window.Android && typeof window.Android.toggleFullScreen === 'function') {
                window.Android.toggleFullScreen(isFull);
            }
        }

        function exitFullScreenJS() {
            isFull = false;
        }
    </script>
</body>
</html>
