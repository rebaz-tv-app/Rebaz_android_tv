name: Build REBAZ TV APK from HTML

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Android Project
        run: |
          cordova create myapp com.rebazandroid.tv "REBAZ TV"
          cd myapp
          rm -rf www/*
          cp ../index.html www/
          cp -r ../*.css ../*.js ../*.png www/ 2>/dev/null || true

      - name: Add Android Platform
        run: |
          cd myapp
          cordova platform add android@12.0.0
          sed -i 's/<\/widget>/  <preference name="AndroidTVSupport" value="true" \/>\n<\/widget>/g' config.xml

      - name: Build APK
        run: |
          cd myapp
          cordova build android --debug

      - name: Prepare Output APK
        run: |
          mkdir -p output_apk
          cp myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk output_apk/rebaz.tv.android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: REBAZ-TV-APK
          path: output_apk/rebaz.tv.android.apk
          retention-days: 14
