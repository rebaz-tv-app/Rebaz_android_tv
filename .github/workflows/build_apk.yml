name: Build REBAZ TV Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native REBAZ TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Native Android Project
        run: |
          mkdir -p android_project/app/src/main/java/com/rebazandroid/tv
          mkdir -p android_project/app/src/main/assets
          mkdir -p android_project/app/src/main/res/layout
          mkdir -p android_project/app/src/main/res/values

          # Copy html and web files
          cp index.html android_project/app/src/main/assets/
          cp -r *.css *.js *.png android_project/app/src/main/assets/ 2>/dev/null || true

          # Create gradle.properties
          cat << 'EOF' > android_project/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # Create settings.gradle
          cat << 'EOF' > android_project/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "REBAZ TV"
          include ':app'
          EOF

          # Create Root build.gradle
          cat << 'EOF' > android_project/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # Create App build.gradle
          cat << 'EOF' > android_project/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rebazandroid.tv'
              compileSdk 34

              defaultConfig {
                  applicationId "com.rebazandroid.tv"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
          }
          EOF

          # Create styles.xml
          cat << 'EOF' > android_project/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar.Fullscreen">
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          EOF

          # Create AndroidManifest.xml
          cat << 'EOF' > android_project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-feature android:name="android.hardware.type.television" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="REBAZ TV"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name="com.rebazandroid.tv.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Create MainActivity.java
          cat << 'EOF' > android_project/app/src/main/java/com/rebazandroid/tv/MainActivity.java
          package com.rebazandroid.tv;

          import android.app.Activity;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.DisplayMetrics;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;

          import androidx.media3.common.MediaItem;
          import androidx.media3.common.MimeTypes;
          import androidx.media3.common.PlaybackException;
          import androidx.media3.common.Player;
          import androidx.media3.datasource.DefaultHttpDataSource;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory;
          import androidx.media3.extractor.DefaultExtractorsFactory;
          import androidx.media3.extractor.ts.DefaultTsPayloadReaderFactory;
          import androidx.media3.ui.PlayerView;

          public class MainActivity extends Activity {
              private WebView webView;
              private ExoPlayer player;
              private PlayerView playerView;
              private String currentUrl = "";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  FrameLayout rootLayout = new FrameLayout(this);
                  rootLayout.setBackgroundColor(Color.parseColor("#060913"));

                  DisplayMetrics metrics = new DisplayMetrics();
                  getWindowManager().getDefaultDisplay().getMetrics(metrics);
                  int screenWidth = metrics.widthPixels;
                  int screenHeight = metrics.heightPixels;

                  float density = metrics.density;
                  int headerHeight = (int) (60 * density);
                  int availableHeight = screenHeight - headerHeight;

                  int playerWidth = (int) (screenWidth * 0.52);
                  int playerHeight = (int) (availableHeight * 0.70);

                  DefaultHttpDataSource.Factory dataSourceFactory = new DefaultHttpDataSource.Factory()
                          .setUserAgent("VLC/3.0.18 LibVLC/3.0.18")
                          .setConnectTimeoutMs(15000)
                          .setReadTimeoutMs(15000)
                          .setAllowCrossProtocolRedirects(true);

                  DefaultExtractorsFactory extractorsFactory = new DefaultExtractorsFactory()
                          .setConstantBitrateSeekingEnabled(true)
                          .setTsExtractorFlags(DefaultTsPayloadReaderFactory.FLAG_ALLOW_NON_IDR_KEYFRAMES);

                  DefaultMediaSourceFactory mediaSourceFactory = new DefaultMediaSourceFactory(this, extractorsFactory)
                          .setDataSourceFactory(dataSourceFactory);

                  player = new ExoPlayer.Builder(this)
                          .setMediaSourceFactory(mediaSourceFactory)
                          .build();

                  playerView = new PlayerView(this);
                  playerView.setPlayer(player);
                  playerView.setUseController(false);
                  playerView.setShutterBackgroundColor(Color.TRANSPARENT);
                  playerView.setKeepContentOnPlayerReset(true);

                  FrameLayout.LayoutParams playerParams = new FrameLayout.LayoutParams(playerWidth, playerHeight);
                  playerParams.topMargin = headerHeight;
                  playerParams.leftMargin = 0;
                  playerView.setLayoutParams(playerParams);

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.TRANSPARENT);
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);

                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowFileAccessFromFileURLs(true);
                  webSettings.setAllowUniversalAccessFromFileURLs(true);
                  webSettings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  webSettings.setUserAgentString("VLC/3.0.18 LibVLC/3.0.18");

                  webView.addJavascriptInterface(new WebAppInterface(), "Android");
                  webView.setWebViewClient(new WebViewClient());

                  rootLayout.addView(playerView);
                  rootLayout.addView(webView);

                  setContentView(rootLayout);

                  player.addListener(new Player.Listener() {
                      @Override
                      public void onPlayerError(PlaybackException error) {
                          new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                              @Override
                              public void run() {
                                  if (player != null && currentUrl != null && !currentUrl.isEmpty()) {
                                      playStreamInternal(currentUrl);
                                  }
                              }
                          }, 3000);
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              private void playStreamInternal(String url) {
                  if (player != null && url != null && !url.isEmpty()) {
                      currentUrl = url;
                      MediaItem mediaItem;
                      if (url.toLowerCase().contains(".ts")) {
                          mediaItem = new MediaItem.Builder()
                                  .setUri(Uri.parse(url))
                                  .setMimeType(MimeTypes.VIDEO_MP2T)
                                  .build();
                      } else if (url.toLowerCase().contains(".m3u8")) {
                          mediaItem = new MediaItem.Builder()
                                  .setUri(Uri.parse(url))
                                  .setMimeType(MimeTypes.APPLICATION_M3U8)
                                  .build();
                      } else {
                          mediaItem = MediaItem.fromUri(Uri.parse(url));
                      }
                      player.setMediaItem(mediaItem);
                      player.prepare();
                      player.setPlayWhenReady(true);
                  }
              }

              public class WebAppInterface {
                  @JavascriptInterface
                  public void playStream(final String url) {
                      new Handler(Looper.getMainLooper()).post(new Runnable() {
                          @Override
                          public void run() {
                              playStreamInternal(url);
                          }
                      });
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (player != null) {
                      player.release();
                      player = null;
                  }
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  if (player != null) {
                      player.pause();
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK via Gradle
        run: |
          cd android_project
          gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Final APK
        run: |
          mkdir -p output_apk
          cp android_project/app/build/outputs/apk/debug/app-debug.apk output_apk/Rebaz-Android-Tv.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rebaz-Android-Tv
          path: output_apk/Rebaz-Android-Tv.apk
          retention-days: 14
