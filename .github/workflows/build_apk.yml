name: Build REBAZ TV - Android TV APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build REBAZ TV (com.rebazandroid.tv)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Project and Build APK
        run: |
          # دۆزینەوەی فۆڵدەری سەرەکی پڕۆژەکە
          BUILD_FILE=$(find . -maxdepth 3 -name "build.gradle*" -not -path "*/app/*" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: build.gradle not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Found project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # پێدانی دەسەڵات بە gradlew ئەگەر هەبێت
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Prepare APK Output
        run: |
          mkdir -p output_apk
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" output_apk/rebaz.tv.android.apk
          else
            echo "APK file not generated!" && exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: REBAZ-TV-APK
          path: output_apk/rebaz.tv.android.apk
          retention-days: 14
