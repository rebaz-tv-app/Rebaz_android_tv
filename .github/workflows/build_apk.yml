name: Build REBAZ TV Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native REBAZ TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Native Android Project
        run: |
          mkdir -p android_project/app/src/main/java/com/rebazandroid/tv
          mkdir -p android_project/app/src/main/assets
          mkdir -p android_project/app/src/main/res/values

          # Copy assets
          cp index.html android_project/app/src/main/assets/ 2>/dev/null || true
          cp -r *.css *.js *.png *.jpg *.jpeg *.ico android_project/app/src/main/assets/ 2>/dev/null || true

          # Inject index.html with mpegts.js engine for direct .ts playback
          cat << 'EOF' > android_project/app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>REBAZ TV</title>
              <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
              <style>
                  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
                  body {
                      background-color: #050811;
                      color: #ffffff;
                      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                      overflow: hidden;
                      height: 100vh;
                      direction: rtl;
                  }
                  .header {
                      height: 48px;
                      background: #080c18;
                      display: flex;
                      align-items: center;
                      justify-content: space-between;
                      padding: 0 15px;
                      border-bottom: 1px solid #141e33;
                  }
                  .nav-links { display: flex; gap: 20px; align-items: center; }
                  .nav-item { font-size: 14px; color: #8fa0c0; cursor: pointer; padding: 5px 8px; border-bottom: 2px solid transparent; }
                  .nav-item.active { color: #e5a93b; font-weight: bold; border-bottom-color: #e5a93b; }
                  .search-box { background: #0d1527; border: 1px solid #1e2c4a; border-radius: 20px; padding: 4px 12px; display: flex; align-items: center; width: 220px; }
                  .search-box input { background: transparent; border: none; color: white; outline: none; width: 100%; font-size: 12px; text-align: right; }
                  .logo { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: bold; color: #00d2ff; }
                  
                  .main-layout { display: flex; height: calc(100vh - 48px); width: 100vw; }
                  .left-side { width: 50%; display: flex; border-left: 1px solid #141e33; background: #070b16; }
                  .categories-col { width: 45%; background: #090e1c; border-left: 1px solid #141e33; overflow-y: auto; }
                  .cat-item { padding: 12px 10px; font-size: 13px; color: #a0b2d6; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-bottom: 1px solid #0d1527; }
                  .cat-item.active, .cat-item:hover, .cat-item:focus { background: #121c33; color: #e5a93b; outline: none; }
                  .cat-count { font-size: 11px; color: #5d7299; }
                  .channels-col { width: 55%; background: #070b16; overflow-y: auto; }
                  .ch-item { padding: 10px; font-size: 13px; color: #d8e4fc; display: flex; align-items: center; gap: 8px; cursor: pointer; border-bottom: 1px solid #0d1527; }
                  .ch-item.active, .ch-item:hover, .ch-item:focus { background: #14213d; color: #ffffff; outline: none; border-right: 3px solid #00d2ff; }
                  .ch-num { font-size: 12px; color: #5d7299; width: 28px; }
                  
                  .right-side { width: 50%; display: flex; flex-direction: column; }
                  .player-space { height: 62%; background: #000; position: relative; }
                  .player-space video { width: 100%; height: 100%; object-fit: contain; }
                  .info-panel { height: 38%; background: #050811; padding: 12px 15px; display: flex; flex-direction: column; justify-content: space-between; border-top: 1px solid #141e33; }
                  .ch-title { font-size: 18px; font-weight: bold; color: #ffffff; }
                  .action-btns { display: flex; justify-content: flex-end; gap: 10px; }
                  .btn { background: #0072ce; color: #ffffff; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; font-weight: bold; }
                  .btn:focus, .btn:hover { background: #0099ff; outline: 2px solid #ffffff; }
                  .btn-fav { background: #1a2744; color: #a0b2d6; }
              </style>
          </head>
          <body>

              <div class="header">
                  <div class="nav-links">
                      <div class="nav-item">مسكن</div>
                      <div class="nav-item active">بث مباشر</div>
                      <div class="nav-item">افلام</div>
                      <div class="nav-item">مسلسلات</div>
                  </div>
                  <div class="search-box">
                      <input type="text" placeholder="بحث...">
                  </div>
                  <div class="logo">
                      <span>📺</span> REBAZ TV
                  </div>
              </div>

              <div class="main-layout">
                  <div class="left-side">
                      <div class="categories-col">
                          <div class="cat-item active" tabindex="0">
                              <span>وەرزشی</span>
                              <span class="cat-count">1</span>
                          </div>
                      </div>
                      <div class="channels-col">
                          <div class="ch-item active" tabindex="0" onclick="playChannel('http://mhiptv.com:8080/live/hk030/6985423976/212760.ts', 'Alwan Sport 1 4K')">
                              <span class="ch-num">1</span>
                              <span>Alwan Sport 1 4K</span>
                          </div>
                      </div>
                  </div>

                  <div class="right-side">
                      <div class="player-space">
                          <video id="mainPlayer" autoplay controls></video>
                      </div>
                      <div class="info-panel">
                          <div class="ch-title" id="selected-ch">Alwan Sport 1 4K</div>
                          <div class="action-btns">
                              <button class="btn btn-fav">إضافة إلى المفضلة</button>
                              <button class="btn" onclick="toggleFull()">شاشەی پڕ (Fullscreen)</button>
                          </div>
                      </div>
                  </div>
              </div>

              <script>
                  let player = null;

                  window.onload = function() {
                      setTimeout(() => {
                          playChannel('http://mhiptv.com:8080/live/hk030/6985423976/212760.ts', 'Alwan Sport 1 4K');
                      }, 500);
                  };

                  function playChannel(url, title) {
                      document.getElementById('selected-ch').innerText = title;
                      let videoElement = document.getElementById('mainPlayer');

                      if (player) {
                          player.destroy();
                          player = null;
                      }

                      if (mpegts.isSupported()) {
                          player = mpegts.createPlayer({
                              type: 'mse',
                              isLive: true,
                              url: url
                          }, {
                              enableWorker: true,
                              lazyLoadMaxDuration: 3 * 60,
                              seekType: 'range'
                          });
                          player.attachMediaElement(videoElement);
                          player.load();
                          player.play().catch(e => console.log("Error playing stream:", e));
                      } else {
                          videoElement.src = url;
                          videoElement.play().catch(e => console.log("Direct play error:", e));
                      }
                  }

                  function toggleFull() {
                      let video = document.getElementById('mainPlayer');
                      if (video) {
                          if (video.requestFullscreen) video.requestFullscreen();
                          else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
                      }
                  }
              </script>
          </body>
          </html>
          EOF

          # Create gradle.properties
          cat << 'EOF' > android_project/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # Create settings.gradle
          cat << 'EOF' > android_project/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "REBAZ TV"
          include ':app'
          EOF

          # Create Root build.gradle
          cat << 'EOF' > android_project/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # Create App build.gradle
          cat << 'EOF' > android_project/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rebazandroid.tv'
              compileSdk 34

              defaultConfig {
                  applicationId "com.rebazandroid.tv"
                  minSdk 21
                  targetSdk 34
                  versionCode 23
                  versionName "23.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # Create styles.xml
          cat << 'EOF' > android_project/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar.Fullscreen">
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          EOF

          # Create AndroidManifest.xml
          cat << 'EOF' > android_project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-feature android:name="android.hardware.type.television" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="REBAZ TV"
                  android:supportsRtl="false"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name="com.rebazandroid.tv.MainActivity"
                      android:exported="true"
                      android:hardwareAccelerated="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Create MainActivity.java with Universal CORS and Custom User-Agent
          cat << 'EOF' > android_project/app/src/main/java/com/rebazandroid/tv/MainActivity.java
          package com.rebazandroid.tv;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  webSettings.setAllowFileAccessFromFileURLs(true);
                  webSettings.setAllowUniversalAccessFromFileURLs(true);
                  webSettings.setMediaPlaybackRequiresUserGesture(false);
                  webSettings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  webSettings.setUserAgentString("VLC/3.0.18 LibVLC/3.0.18");

                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK via Gradle
        run: |
          cd android_project
          gradle assembleDebug --stacktrace

      - name: Prepare Final APK
        run: |
          mkdir -p output_apk
          cp android_project/app/build/outputs/apk/debug/app-debug.apk output_apk/Rebaz-Android-Tv.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rebaz-Android-Tv
          path: output_apk/Rebaz-Android-Tv.apk
          retention-days: 14
