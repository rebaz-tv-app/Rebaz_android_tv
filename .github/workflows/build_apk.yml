name: Build REBAZ TV Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native REBAZ TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Native Android Project
        run: |
          mkdir -p android_project/app/src/main/java/com/rebazandroid/tv
          mkdir -p android_project/app/src/main/assets
          mkdir -p android_project/app/src/main/res/values

          # Copy ALL user design files from repository directly into assets
          cp index.html android_project/app/src/main/assets/ 2>/dev/null || true
          cp -r *.css *.js *.png *.jpg *.jpeg *.ico android_project/app/src/main/assets/ 2>/dev/null || true

          # Create gradle.properties
          cat << 'EOF' > android_project/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

          # Create settings.gradle with explicit Google Maven URL
          cat << 'EOF' > android_project/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  maven { url 'https://maven.google.com' }
                  mavenCentral()
              }
          }
          rootProject.name = "REBAZ TV"
          include ':app'
          EOF

          # Create Root build.gradle
          cat << 'EOF' > android_project/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # Create App build.gradle with ExoPlayer
          cat << 'EOF' > android_project/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rebazandroid.tv'
              compileSdk 34

              defaultConfig {
                  applicationId "com.rebazandroid.tv"
                  minSdk 21
                  targetSdk 34
                  versionCode 17
                  versionName "17.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-exoplayer-ui:1.2.1'
          }
          EOF

          # Create styles.xml
          cat << 'EOF' > android_project/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar.Fullscreen">
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          EOF

          # Create AndroidManifest.xml
          cat << 'EOF' > android_project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-feature android:name="android.hardware.type.television" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="REBAZ TV"
                  android:supportsRtl="false"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name="com.rebazandroid.tv.MainActivity"
                      android:exported="true"
                      android:hardwareAccelerated="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Create MainActivity.java
          cat << 'EOF' > android_project/app/src/main/java/com/rebazandroid/tv/MainActivity.java
          package com.rebazandroid.tv;

          import android.app.Activity;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import androidx.media3.common.MediaItem;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.ui.PlayerView;

          public class MainActivity extends Activity {
              private WebView webView;
              private ExoPlayer player;
              private PlayerView playerView;
              private TextView titleTextView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout rootLayout = new LinearLayout(this);
                  rootLayout.setOrientation(LinearLayout.HORIZONTAL);
                  rootLayout.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  rootLayout.setBackgroundColor(Color.parseColor("#050811"));
                  rootLayout.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  webView = new WebView(this);
                  LinearLayout.LayoutParams webParams = new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.MATCH_PARENT, 1.0f);
                  webView.setLayoutParams(webParams);
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);

                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  webView.addJavascriptInterface(new WebAppInterface(), "Android");
                  webView.setWebViewClient(new WebViewClient());

                  LinearLayout leftPanel = new LinearLayout(this);
                  leftPanel.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout.LayoutParams leftParams = new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.MATCH_PARENT, 1.0f);
                  leftPanel.setLayoutParams(leftParams);
                  leftPanel.setBackgroundColor(Color.parseColor("#050811"));

                  playerView = new PlayerView(this);
                  LinearLayout.LayoutParams playerParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 0.62f);
                  playerView.setLayoutParams(playerParams);
                  playerView.setBackgroundColor(Color.BLACK);

                  LinearLayout infoPanel = new LinearLayout(this);
                  infoPanel.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout.LayoutParams infoParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 0.38f);
                  infoPanel.setLayoutParams(infoParams);
                  infoPanel.setPadding(30, 20, 30, 20);
                  infoPanel.setBackgroundColor(Color.parseColor("#050811"));

                  titleTextView = new TextView(this);
                  titleTextView.setText("Alwan Sport 1 4K");
                  titleTextView.setTextColor(Color.WHITE);
                  titleTextView.setTextSize(18);
                  titleTextView.setTypeface(null, android.graphics.Typeface.BOLD);
                  infoPanel.addView(titleTextView);

                  LinearLayout btnLayout = new LinearLayout(this);
                  btnLayout.setOrientation(LinearLayout.HORIZONTAL);
                  btnLayout.setGravity(Gravity.END);
                  LinearLayout.LayoutParams btnLayoutParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  btnLayoutParams.topMargin = 15;
                  btnLayout.setLayoutParams(btnLayoutParams);

                  Button btnFav = new Button(this);
                  btnFav.setText("إضافة إلى المفضلة");
                  btnFav.setBackgroundColor(Color.parseColor("#1a2744"));
                  btnFav.setTextColor(Color.parseColor("#a0b2d6"));
                  btnFav.setPadding(20, 10, 20, 10);

                  Button btnFull = new Button(this);
                  btnFull.setText("شاشەی پڕ (Fullscreen)");
                  btnFull.setBackgroundColor(Color.parseColor("#0072ce"));
                  btnFull.setTextColor(Color.WHITE);
                  btnFull.setPadding(20, 10, 20, 10);
                  LinearLayout.LayoutParams fullParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  fullParams.rightMargin = 15;
                  btnFull.setLayoutParams(fullParams);

                  btnLayout.addView(btnFull);
                  btnLayout.addView(btnFav);
                  infoPanel.addView(btnLayout);

                  leftPanel.addView(playerView);
                  leftPanel.addView(infoPanel);

                  rootLayout.addView(webView);
                  rootLayout.addView(leftPanel);

                  setContentView(rootLayout);

                  player = new ExoPlayer.Builder(this).build();
                  playerView.setPlayer(player);

                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class WebAppInterface {
                  @JavascriptInterface
                  public void playStream(final String url, final String title) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  if (player != null) {
                                      MediaItem mediaItem = MediaItem.fromUri(Uri.parse(url));
                                      player.setMediaItem(mediaItem);
                                      player.prepare();
                                      player.play();
                                  }
                                  if (titleTextView != null) {
                                      titleTextView.setText(title);
                                  }
                              } catch (Exception e) {
                                  e.printStackTrace();
                              }
                          }
                      });
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (player != null) {
                      player.release();
                      player = null;
                  }
              }

              @Override
              protected void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK via Gradle
        run: |
          cd android_project
          gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Final APK
        run: |
          mkdir -p output_apk
          cp android_project/app/build/outputs/apk/debug/app-debug.apk output_apk/Rebaz-Android-Tv.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rebaz-Android-Tv
          path: output_apk/Rebaz-Android-Tv.apk
          retention-days: 14
