name: Build REBAZ TV Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native REBAZ TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Native Android Project
        run: |
          mkdir -p android_project/app/src/main/java/com/rebazandroid/tv
          mkdir -p android_project/app/src/main/assets
          mkdir -p android_project/app/src/main/res/values

          # Download HLS and MPEGTS player libraries locally
          curl -sL https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js -o android_project/app/src/main/assets/hls.min.js
          curl -sL https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js -o android_project/app/src/main/assets/mpegts.min.js

          # Inject index.html with Dynamic M3U Playlist Parser + Fallback Engine
          cat << 'EOF' > android_project/app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>REBAZ TV</title>
              <script src="hls.min.js"></script>
              <script src="mpegts.min.js"></script>
              <style>
                  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
                  body {
                      background-color: #050811;
                      color: #ffffff;
                      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                      overflow: hidden;
                      height: 100vh;
                      direction: rtl;
                  }
                  .header { height: 50px; background: #080c18; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #141e33; }
                  .m3u-bar { display: flex; gap: 8px; align-items: center; flex: 1; max-width: 450px; margin: 0 15px; }
                  .m3u-input { background: #0d1527; border: 1px solid #1e2c4a; border-radius: 6px; padding: 5px 10px; color: #fff; font-size: 11px; width: 100%; outline: none; }
                  .btn-load { background: #e5a93b; color: #000; border: none; padding: 5px 12px; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer; white-space: nowrap; }
                  .search-box { background: #0d1527; border: 1px solid #1e2c4a; border-radius: 20px; padding: 4px 12px; display: flex; align-items: center; width: 180px; }
                  .search-box input { background: transparent; border: none; color: white; outline: none; width: 100%; font-size: 12px; text-align: right; }
                  .logo { display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: bold; color: #00d2ff; white-space: nowrap; }
                  
                  .main-layout { display: flex; height: calc(100vh - 50px); width: 100vw; }
                  .left-side { width: 50%; display: flex; border-left: 1px solid #141e33; background: #070b16; }
                  .categories-col { width: 45%; background: #090e1c; border-left: 1px solid #141e33; overflow-y: auto; }
                  .cat-item { padding: 12px 10px; font-size: 12px; color: #a0b2d6; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-bottom: 1px solid #0d1527; }
                  .cat-item.active, .cat-item:hover, .cat-item:focus { background: #121c33; color: #e5a93b; outline: none; font-weight: bold; }
                  .cat-count { font-size: 10px; color: #5d7299; background: #0d1527; padding: 2px 6px; border-radius: 10px; }
                  .channels-col { width: 55%; background: #070b16; overflow-y: auto; }
                  .ch-item { padding: 10px; font-size: 12px; color: #d8e4fc; display: flex; align-items: center; gap: 8px; cursor: pointer; border-bottom: 1px solid #0d1527; }
                  .ch-item.active, .ch-item:hover, .ch-item:focus { background: #14213d; color: #ffffff; outline: none; border-right: 3px solid #00d2ff; }
                  .ch-num { font-size: 11px; color: #5d7299; width: 25px; text-align: center; }
                  
                  .right-side { width: 50%; display: flex; flex-direction: column; }
                  .player-space { height: 65%; background: #000; position: relative; }
                  .player-space video { width: 100%; height: 100%; object-fit: contain; }
                  .info-panel { height: 35%; background: #050811; padding: 12px 15px; display: flex; flex-direction: column; justify-content: space-between; border-top: 1px solid #141e33; }
                  .ch-title { font-size: 16px; font-weight: bold; color: #ffffff; }
                  .action-btns { display: flex; justify-content: flex-end; gap: 10px; }
                  .btn { background: #0072ce; color: #ffffff; border: none; padding: 8px 16px; border-radius: 20px; font-size: 12px; cursor: pointer; font-weight: bold; }
                  .btn:focus, .btn:hover { background: #0099ff; outline: 2px solid #ffffff; }
                  .status-msg { font-size: 11px; color: #8fa0c0; }
              </style>
          </head>
          <body>
              <div class="header">
                  <div class="logo"><span>📺</span> REBAZ TV</div>
                  <div class="m3u-bar">
                      <input type="text" id="m3uUrl" class="m3u-input" placeholder="لینکی M3U بنووسە یان لێرە دایبنێ..." value="http://mhiptv.com:8080/get.php?username=hk030&password=6985423976&type=m3u_plus&output=ts">
                      <button class="btn-load" onclick="loadM3U()">داگرتن</button>
                  </div>
                  <div class="search-box">
                      <input type="text" id="searchInput" oninput="filterChannels()" placeholder="گەڕان...">
                  </div>
              </div>

              <div class="main-layout">
                  <div class="left-side">
                      <div class="categories-col" id="categoriesList">
                          <div class="cat-item active"><span>تکایە چاوەڕێ بکە...</span></div>
                      </div>
                      <div class="channels-col" id="channelsList">
                          <!-- Dynamic Channels -->
                      </div>
                  </div>

                  <div class="right-side">
                      <div class="player-space">
                          <video id="mainPlayer" autoplay controls playsinline></video>
                      </div>
                      <div class="info-panel">
                          <div>
                              <div class="ch-title" id="selected-ch">تکایە کەناڵێک هەڵبژێرە</div>
                              <div class="status-msg" id="statusMsg">ئامادەیە بۆ پەخش...</div>
                          </div>
                          <div class="action-btns">
                              <button class="btn" onclick="toggleFull()">شاشەی پڕ (Fullscreen)</button>
                          </div>
                      </div>
                  </div>
              </div>

              <script>
                  let allChannels = [];
                  let currentCategory = 'ALL';
                  let currentHls = null;
                  let currentMpegts = null;

                  window.onload = function() {
                      let savedUrl = localStorage.getItem('rebaz_m3u_url');
                      if (savedUrl) {
                          document.getElementById('m3uUrl').value = savedUrl;
                      }
                      loadM3U();
                  };

                  function loadM3U() {
                      let url = document.getElementById('m3uUrl').value.trim();
                      if (!url) return;
                      
                      localStorage.setItem('rebaz_m3u_url', url);
                      document.getElementById('statusMsg').innerText = "لە حالەتی داگرتنی لیستەکەدا...";

                      fetch(url)
                          .then(response => {
                              if (!response.ok) throw new Error('تۆڕ یان سێرڤەر وەڵامی نەدایەوە');
                              return response.text();
                          })
                          .then(data => {
                              parseAndDisplayM3U(data);
                              document.getElementById('statusMsg').innerText = "لیستەکە بە سەرکەوتوویی بارکرا.";
                          })
                          .catch(err => {
                              console.log("Direct fetch error, trying backup parse:", err);
                              allChannels = [
                                  { name: "Alwan Sport 1 (.TS)", group: "وەرزشی", url: "http://mhiptv.com:8080/live/hk030/6985423976/212760.ts" }
                              ];
                              renderCategories();
                              renderChannels(allChannels);
                              document.getElementById('statusMsg').innerText = "کێشە لە داگرتنی M3U بەڵام کەناڵی تاقیکاری ئامادەیە.";
                          });
                  }

                  function parseAndDisplayM3U(content) {
                      let lines = content.split('\n');
                      allChannels = [];
                      let currentGroup = "گشتی";
                      let currentName = "";

                      for (let i = 0; i < lines.length; i++) {
                          let line = lines[i].trim();
                          if (line.startsWith('#EXTINF:')) {
                              let groupMatch = line.match(/group-title="([^"]+)"/i);
                              if (groupMatch && groupMatch[1]) {
                                  currentGroup = groupMatch[1].trim();
                              } else {
                                  currentGroup = "گشتی";
                              }
                              let commaIdx = line.lastIndexOf(',');
                              if (commaIdx !== -1) {
                                  currentName = line.substring(commaIdx + 1).trim();
                              } else {
                                  currentName = "کەناڵ " + (allChannels.length + 1);
                              }
                          } else if (line.length > 0 && !line.startsWith('#')) {
                              if (currentName) {
                                  allChannels.push({
                                      name: currentName,
                                      group: currentGroup,
                                      url: line
                                  });
                                  currentName = "";
                              }
                          }
                      }

                      renderCategories();
                      selectCategory('ALL');
                  }

                  function renderCategories() {
                      let catContainer = document.getElementById('categoriesList');
                      catContainer.innerHTML = '';

                      let groups = {};
                      allChannels.forEach(ch => {
                          groups[ch.group] = (groups[ch.group] || 0) + 1;
                      });

                      let allDiv = document.createElement('div');
                      allDiv.className = 'cat-item active';
                      allDiv.onclick = () => selectCategory('ALL', allDiv);
                      allDiv.innerHTML = `<span>هەموو کەناڵەکان</span><span class="cat-count">${allChannels.length}</span>`;
                      catContainer.appendChild(allDiv);

                      Object.keys(groups).forEach(grp => {
                          let div = document.createElement('div');
                          div.className = 'cat-item';
                          div.onclick = () => selectCategory(grp, div);
                          div.innerHTML = `<span>${grp}</span><span class="cat-count">${groups[grp]}</span>`;
                          catContainer.appendChild(div);
                      });
                  }

                  function selectCategory(grp, element) {
                      currentCategory = grp;
                      document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
                      if (element) element.classList.add('active');

                      let filtered = grp === 'ALL' ? allChannels : allChannels.filter(c => c.group === grp);
                      renderChannels(filtered);
                  }

                  function renderChannels(channels) {
                      let chContainer = document.getElementById('channelsList');
                      chContainer.innerHTML = '';

                      channels.forEach((ch, idx) => {
                          let div = document.createElement('div');
                          div.className = 'ch-item';
                          div.onclick = () => playChannel(ch.url, ch.name, div);
                          div.innerHTML = `<span class="ch-num">${idx + 1}</span><span>${ch.name}</span>`;
                          chContainer.appendChild(div);
                      });

                      if (channels.length > 0) {
                          playChannel(channels[0].url, channels[0].name, chContainer.firstChild);
                      }
                  }

                  function filterChannels() {
                      let q = document.getElementById('searchInput').value.toLowerCase();
                      let baseList = currentCategory === 'ALL' ? allChannels : allChannels.filter(c => c.group === currentCategory);
                      let filtered = baseList.filter(c => c.name.toLowerCase().includes(q));
                      renderChannels(filtered);
                  }

                  function destroyPlayers() {
                      if (currentHls) { currentHls.destroy(); currentHls = null; }
                      if (currentMpegts) { currentMpegts.destroy(); currentMpegts = null; }
                  }

                  function playChannel(url, title, element) {
                      document.getElementById('selected-ch').innerText = title;
                      document.getElementById('statusMsg').innerText = "پەخش دەکرێت...";
                      document.querySelectorAll('.ch-item').forEach(el => el.classList.remove('active'));
                      if (element) element.classList.add('active');

                      let videoElement = document.getElementById('mainPlayer');
                      destroyPlayers();

                      let isTs = url.toLowerCase().includes('.ts');
                      let fallbackM3u8 = isTs ? url.replace('.ts', '.m3u8') : url;

                      if (isTs && typeof mpegts !== 'undefined' && mpegts.isSupported()) {
                          try {
                              currentMpegts = mpegts.createPlayer({
                                  type: 'mse',
                                  isLive: true,
                                  url: url
                              });
                              currentMpegts.attachMediaElement(videoElement);
                              currentMpegts.load();
                              currentMpegts.play().catch(e => {
                                  console.log("MPEGTS Play Error, switching to HLS/Native fallback", e);
                                  playHlsOrNative(fallbackM3u8, videoElement);
                              });

                              currentMpegts.on(mpegts.Events.ERROR, function() {
                                  playHlsOrNative(fallbackM3u8, videoElement);
                              });
                          } catch (e) {
                              playHlsOrNative(fallbackM3u8, videoElement);
                          }
                      } else {
                          playHlsOrNative(fallbackM3u8, videoElement);
                      }
                  }

                  function playHlsOrNative(url, videoElement) {
                      destroyPlayers();
                      videoElement.src = url;
                      videoElement.play().catch(e => {
                          if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                              currentHls = new Hls({ enableWorker: true, lowLatencyMode: true });
                              currentHls.loadSource(url);
                              currentHls.attachMedia(videoElement);
                              currentHls.on(Hls.Events.MANIFEST_PARSED, function() {
                                  videoElement.play();
                              });
                          }
                      });
                  }

                  function toggleFull() {
                      let video = document.getElementById('mainPlayer');
                      if (video) {
                          if (video.requestFullscreen) video.requestFullscreen();
                          else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
                      }
                  }
              </script>
          </body>
          </html>
          EOF

          # Create gradle.properties
          cat << 'EOF' > android_project/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # Create settings.gradle
          cat << 'EOF' > android_project/settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal(); } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral(); } }
          rootProject.name = "REBAZ TV"
          include ':app'
          EOF

          # Create Root build.gradle
          cat << 'EOF' > android_project/build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          # Create App build.gradle
          cat << 'EOF' > android_project/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.rebazandroid.tv'
              compileSdk 34
              defaultConfig { applicationId "com.rebazandroid.tv"; minSdk 21; targetSdk 34; versionCode 27; versionName "27.0" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

          # Create styles.xml
          cat << 'EOF' > android_project/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar.Fullscreen">
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          EOF

          # Create AndroidManifest.xml
          cat << 'EOF' > android_project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-feature android:name="android.hardware.type.television" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:label="REBAZ TV"
                  android:supportsRtl="false"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name="com.rebazandroid.tv.MainActivity"
                      android:exported="true"
                      android:hardwareAccelerated="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Create MainActivity.java
          cat << 'EOF' > android_project/app/src/main/java/com/rebazandroid/tv/MainActivity.java
          package com.rebazandroid.tv;

          import android.app.Activity;
          import android.net.http.SslError;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.SslErrorHandler;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private View customView;
              private WebChromeClient.CustomViewCallback customViewCallback;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedSslError(WebView view, SslErrorHandler handler, SslError error) {
                          handler.proceed();
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customViewCallback = callback;
                          setContentView(customView);
                      }

                      @Override
                      public void onHideCustomView() {
                          if (customView == null) return;
                          customView = null;
                          customViewCallback.onCustomViewHidden();
                          setContentView(webView);
                      }
                  });

                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  
                  try {
                      webSettings.setAllowFileAccessFromFileURLs(true);
                      webSettings.setAllowUniversalAccessFromFileURLs(true);
                  } catch (Exception e) { }

                  webSettings.setMediaPlaybackRequiresUserGesture(false);
                  webSettings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  webSettings.setUserAgentString("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36");

                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (customView != null) {
                      webView.getWebChromeClient().onHideCustomView();
                  } else if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK via Gradle
        run: |
          cd android_project
          gradle assembleDebug --stacktrace

      - name: Prepare Final APK
        run: |
          mkdir -p output_apk
          cp android_project/app/build/outputs/apk/debug/app-debug.apk output_apk/Rebaz-Android-Tv.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rebaz-Android-Tv
          path: output_apk/Rebaz-Android-Tv.apk
          retention-days: 14
