name: Build REBAZ TV Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native REBAZ TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Native Android Project
        run: |
          mkdir -p android_project/app/src/main/java/com/rebazandroid/tv
          mkdir -p android_project/app/src/main/assets
          mkdir -p android_project/app/src/main/res/values

          # Copy ALL user design files from repository directly into assets
          cp index.html android_project/app/src/main/assets/ 2>/dev/null || true
          cp -r *.css *.js *.png *.jpg *.jpeg *.ico android_project/app/src/main/assets/ 2>/dev/null || true

          # Create gradle.properties
          cat << 'EOF' > android_project/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # Create settings.gradle
          cat << 'EOF' > android_project/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "REBAZ TV"
          include ':app'
          EOF

          # Create Root build.gradle
          cat << 'EOF' > android_project/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # Create App build.gradle
          cat << 'EOF' > android_project/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rebazandroid.tv'
              compileSdk 34

              defaultConfig {
                  applicationId "com.rebazandroid.tv"
                  minSdk 21
                  targetSdk 34
                  versionCode 14
                  versionName "14.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # Create styles.xml
          cat << 'EOF' > android_project/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar.Fullscreen">
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          EOF

          # Create AndroidManifest.xml
          cat << 'EOF' > android_project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-feature android:name="android.hardware.type.television" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="REBAZ TV"
                  android:supportsRtl="false"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name="com.rebazandroid.tv.MainActivity"
                      android:exported="true"
                      android:hardwareAccelerated="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Create MainActivity.java with JavaScript Bridge & Video Intent Support
          cat << 'EOF' > android_project/app/src/main/java/com/rebazandroid/tv/MainActivity.java
          package com.rebazandroid.tv;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private WebView webView;
              private View customView;
              private WebChromeClient.CustomViewCallback customViewCallback;
              private FrameLayout fullscreenContainer;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);

                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setDatabaseEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowFileAccessFromFileURLs(true);
                  webSettings.setAllowUniversalAccessFromFileURLs(true);
                  webSettings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  webSettings.setMediaPlaybackRequiresUserGesture(false);
                  webSettings.setCacheMode(WebSettings.LOAD_NO_CACHE);

                  webView.clearCache(true);
                  webView.clearHistory();

                  // ڕێکخستنی پردی پەیوەندی لەگەڵ JavaScript
                  webView.addJavascriptInterface(new WebAppInterface(), "Android");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          view.loadUrl(url);
                          return true;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customViewCallback = callback;
                          
                          webView.setVisibility(View.GONE);
                          
                          fullscreenContainer = new FrameLayout(MainActivity.this);
                          fullscreenContainer.setBackgroundColor(0xFF000000);
                          fullscreenContainer.addView(customView, new ViewGroup.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          setContentView(fullscreenContainer);
                      }

                      @Override
                      public void onHideCustomView() {
                          if (customView == null) return;
                          
                          setContentView(webView);
                          if (fullscreenContainer != null) {
                              fullscreenContainer.removeView(customView);
                          }
                          customView = null;
                          webView.setVisibility(View.VISIBLE);
                          if (customViewCallback != null) {
                              customViewCallback.onCustomViewHidden();
                          }
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }

              public class WebAppInterface {
                  @JavascriptInterface
                  public void playStream(final String url) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_VIEW);
                                  intent.setDataAndType(Uri.parse(url), "video/*");
                                  startActivity(intent);
                              } catch (Exception e) {
                                  Toast.makeText(MainActivity.this, "هیچ پلەیەرێک بۆ پەخشکردن نەدۆزرایەوە", Toast.LENGTH_SHORT).show();
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void toggleFullScreen(boolean isFull) {
                      // بەڕێوەبردنی شاشەی پڕ
                  }
              }

              @Override
              public void onBackPressed() {
                  if (customView != null) {
                      WebChromeClient chromeClient = webView.getWebChromeClient();
                      if (chromeClient != null) {
                          chromeClient.onHideCustomView();
                      }
                  } else if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK via Gradle
        run: |
          cd android_project
          gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Final APK
        run: |
          mkdir -p output_apk
          cp android_project/app/build/outputs/apk/debug/app-debug.apk output_apk/Rebaz-Android-Tv.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rebaz-Android-Tv
          path: output_apk/Rebaz-Android-Tv.apk
          retention-days: 14
